<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Trading Bridge</title>
  <desc id="d">From idea to execution: research, backtest, validate and trade quantitative strategies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="0.55" stop-color="#121216"/>
      <stop offset="1" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>

  <!-- candlesticks -->
  <g opacity="0.55">
    <g stroke="#10b981" fill="#10b981">
      <line x1="700" y1="250" x2="700" y2="320"/><rect x="694" y="262" width="12" height="44" rx="2"/>
      <line x1="760" y1="230" x2="760" y2="300"/><rect x="754" y="240" width="12" height="40" rx="2"/>
      <line x1="880" y1="175" x2="880" y2="250"/><rect x="874" y="185" width="12" height="48" rx="2"/>
      <line x1="1000" y1="130" x2="1000" y2="200"/><rect x="994" y="138" width="12" height="46" rx="2"/>
      <line x1="1120" y1="70" x2="1120" y2="150"/><rect x="1114" y="80" width="12" height="52" rx="2"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="820" y1="215" x2="820" y2="285"/><rect x="814" y="228" width="12" height="36" rx="2"/>
      <line x1="940" y1="160" x2="940" y2="230"/><rect x="934" y="172" width="12" height="34" rx="2"/>
      <line x1="1060" y1="110" x2="1060" y2="175"/><rect x="1054" y="120" width="12" height="32" rx="2"/>
    </g>
  </g>

  <!-- equity curve -->
  <path d="M640 330 C700 320 720 290 770 285 S840 300 870 250 S930 230 960 200 S1020 190 1050 150 S1120 120 1150 95 L1230 70 L1230 420 L640 420 Z" fill="url(#area)"/>
  <path d="M640 330 C700 320 720 290 770 285 S840 300 870 250 S930 230 960 200 S1020 190 1050 150 S1120 120 1150 95 L1230 70"
        fill="none" stroke="url(#orange)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"
        stroke-dasharray="900" stroke-dashoffset="900">
    <animate attributeName="stroke-dashoffset" from="900" to="0" dur="2.4s" fill="freeze"/>
  </path>
  <circle cx="1230" cy="70" r="7" fill="#f59e0b" filter="url(#glow)">
    <animate attributeName="r" values="6;10;6" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- logo + title -->
  <g transform="translate(72,96)">
    <path d="M0 34 L18 16 L30 28 L52 6" fill="none" stroke="url(#orange)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 4 H54 V18" fill="none" stroke="url(#orange)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="72" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Trading Bridge</text>
  <text x="74" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="26" font-weight="500" fill="#d4d4d8">From idea <tspan fill="#f59e0b" font-weight="700">→</tspan> backtest <tspan fill="#f59e0b" font-weight="700">→</tspan> live execution.</text>
  <text x="74" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="19" fill="#a1a1aa">A prop-shop quant research platform for solo traders.</text>

  <!-- chips -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600">
    <g transform="translate(74,318)">
      <rect width="118" height="34" rx="17" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="59" y="22" text-anchor="middle" fill="#fbbf24">⚡ FUTURES</text>
    </g>
    <g transform="translate(204,318)">
      <rect width="100" height="34" rx="17" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.6"/>
      <text x="50" y="22" text-anchor="middle" fill="#93c5fd">💱 FOREX</text>
    </g>
    <g transform="translate(316,318)">
      <rect width="118" height="34" rx="17" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.6"/>
      <text x="59" y="22" text-anchor="middle" fill="#6ee7b7">📈 EQUITIES</text>
    </g>
    <g transform="translate(446,318)">
      <rect width="130" height="34" rx="17" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.6"/>
      <text x="65" y="22" text-anchor="middle" fill="#d8b4fe">OANDA · IBKR</text>
    </g>
  </g>

  <!-- live pill -->
  <g transform="translate(1068,30)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700">
    <rect width="170" height="30" rx="15" fill="#052e1c" stroke="#10b981" stroke-opacity="0.6"/>
    <circle cx="20" cy="15" r="5" fill="#10b981"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="34" y="20" fill="#6ee7b7">SYSTEM READY</text>
  </g>
</svg>


# docker-compose.yml — VPS Live Trading Platform
# Utilisation: docker compose up -d
#
# Services:
#   trader     — LiveStrategyRunner (Java 21, OANDA Practice)
#
# Configuration:
#   - OANDA credentials are loaded from trading-dashboard/.env
#   - Default strategy: VWPReversion + ConsecBar on USD/CHF (highest Sharpe: 4.47)
#   - Change strategy via: STRATEGY=vwp STRATEGY_PAIR=USD_CHF docker compose up -d

services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-live
    restart: unless-stopped
    env_file:
      - ./.env.paper
    environment:
      - OANDA_ENV=practice
      - LOG_LEVEL=INFO
      - TB_ALLOW_ORDERS=1
      # Strategy selection (override via env):
      # vwp → VWPReversionStrategy, consecbar → ConsecutiveBarExhaustionStrategy
      # nymid → NYMidSessionMomentumStrategy, gobig → GoBigStrategy
      # casino → CasinoStrategy, all → all strategies sequentially
      # Or any sqimported: 2_31_177, 2_14_147, 2_15_195, etc.
      - STRATEGY=${STRATEGY:-vwpreversion consecbar}
      - STRATEGY_PAIR=${STRATEGY_PAIR:-USD_CHF}
      - GRANULARITY=${GRANULARITY:-H1}
      - INTERVAL_SEC=${INTERVAL_SEC:-60}
    command: ["$${OANDA_API_KEY}", "$${OANDA_ACCOUNT_ID}", "$${STRATEGY}", "$${GRANULARITY}", "$${INTERVAL_SEC}"]
    volumes:
      - ./data:/app/data        # Trade persistence
      - ./logs:/app/logs        # Logs
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # NFP Week — Short EUR/USD macro play during NFP release week
  # Runs June 1-5, 2026. Volatility-aware trailing stop with NFP-day widening.
  nfp-week:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-nfp-week
    restart: "no"
    env_file:
      - /home/martinfou/projects/trading-dashboard/.env
    environment:
      - OANDA_ENV=practice
      - LOG_LEVEL=INFO
      - TB_ALLOW_ORDERS=1
      - STRATEGY=${NFP_STRATEGY:-nfpweek}
      - STRATEGY_PAIR=${NFP_PAIR:-EUR_USD}
      - GRANULARITY=${NFP_GRANULARITY:-H1}
      - INTERVAL_SEC=${NFP_INTERVAL:-60}
    command: ["$${OANDA_API_KEY}", "$${OANDA_ACCOUNT_ID}", "$${STRATEGY}", "$${GRANULARITY}", "$${INTERVAL_SEC}"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Composite Momentum — USD/JPY (OOS PF=2.24, Sharpe=1.00, DD=8.6%)
  comp-momentum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-comp-momentum
    restart: unless-stopped
    env_file:
      - ./.env.paper
    environment:
      - OANDA_ENV=practice
      - LOG_LEVEL=INFO
      - TB_ALLOW_ORDERS=1
      - STRATEGY=${COMP_STRATEGY:-compmomentum}
      - STRATEGY_PAIR=${COMP_PAIR:-USD_JPY}
      - GRANULARITY=${COMP_GRANULARITY:-H1}
      - INTERVAL_SEC=${COMP_INTERVAL:-60}
    command: ["$${OANDA_API_KEY}", "$${OANDA_ACCOUNT_ID}", "$${STRATEGY}", "$${GRANULARITY}", "$${INTERVAL_SEC}"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Month Week-Phase — USD/JPY (OOS PF=2.33, DD=4.86%, strong DD control)
  month-week:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-month-week
    restart: unless-stopped
    env_file:
      - ./.env.paper
    environment:
      - OANDA_ENV=practice
      - LOG_LEVEL=INFO
      - TB_ALLOW_ORDERS=1
      - STRATEGY=${MWP_STRATEGY:-monthweekphase}
      - STRATEGY_PAIR=${MWP_PAIR:-USD_JPY}
      - GRANULARITY=${MWP_GRANULARITY:-H1}
      - INTERVAL_SEC=${MWP_INTERVAL:-60}
    command: ["$${OANDA_API_KEY}", "$${OANDA_ACCOUNT_ID}", "$${STRATEGY}", "$${GRANULARITY}", "$${INTERVAL_SEC}"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # LtRSI3Momentum — RSI(3) Drift Following (EUR/USD, Sharpe>1.0 post look-ahead fix)
  lt-rsi3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-lt-rsi3
    restart: unless-stopped
    env_file:
      - ./.env.paper
    environment:
      - OANDA_ENV=practice
      - LOG_LEVEL=INFO
      - TB_ALLOW_ORDERS=1
      - STRATEGY=${LTRSI3_STRATEGY:-ltrsi3}
      - STRATEGY_PAIR=${LTRSI3_PAIR:-EUR_USD}
      - GRANULARITY=${LTRSI3_GRANULARITY:-H1}
      - INTERVAL_SEC=${LTRSI3_INTERVAL:-60}
    command: ["$${OANDA_API_KEY}", "$${OANDA_ACCOUNT_ID}", "$${STRATEGY}", "$${GRANULARITY}", "$${INTERVAL_SEC}"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ===========================================================================
  # News week 12-16 October 2026 — coded from docs/news-playbooks/week-2026-10-12.md
  # ONE SERVICE PER INSTRUMENT: the runner resolves a single instrument per process and
  # each news strategy pins its own pair, so EUR_USD, AUD_JPY and GBP_CHF cannot share a
  # container. The risk they add to the account is funded by decision D42
  # (docs/TRADING-GUARDRAILS.md); the whole lane is removed at the end of the week, and
  # that removal is also what puts the account ceiling back to 3%.
  # ===========================================================================
  news-oct12-eur:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-news-oct12-eur
    restart: "no"
    env_file:
      - /home/martinfou/projects/trading-dashboard/.env
    environment:
      - OANDA_ENV=practice
      - LOG_LEVEL=INFO
      - TB_ALLOW_ORDERS=1
      - STRATEGY=${NEWSOCT12_EUR_STRATEGY:-newsoct12cpi newsoct12ppi}
      - STRATEGY_PAIR=${NEWSOCT12_EUR_PAIR:-EUR_USD}
      - GRANULARITY=${NEWSOCT12_EUR_GRANULARITY:-H1}
      - INTERVAL_SEC=${NEWSOCT12_EUR_INTERVAL:-60}
    command: ["$${OANDA_API_KEY}", "$${OANDA_ACCOUNT_ID}", "$${STRATEGY}", "$${GRANULARITY}", "$${INTERVAL_SEC}"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Chinese CPI (Tue 13 Oct 21:30 ET) on the Aussie, flat Wednesday 16:00 ET
  news-oct12-aj:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-news-oct12-aj
    restart: "no"

  # NFP Week — Short EUR/USD macro play during NFP release week
  # Runs June 1-5, 2026. Volatility-aware trailing stop with NFP-day widening.
  nfp-week:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-nfp-week
    restart: "no"
    # Was the dashboard's .env, which carries the dormant -012 account: any container created
    # from it dies on a 401 before its first bar. Every other paper service uses .env.paper.
    env_file:
      - ./.env.paper
    environment:
      - OANDA_ENV=practice
      - LOG_LEVEL=INFO
      - TB_ALLOW_ORDERS=1
      # Persistent per-strategy state directory (story 50.1): survives container recreation.
      - TB_STATE_DIR=/app/data/state
      - STRATEGY=${NFP_STRATEGY:-nfpweek}
      - STRATEGY_PAIR=${NFP_PAIR:-EUR_USD}
      - GRANULARITY=${NFP_GRANULARITY:-H1}
      - INTERVAL_SEC=${NFP_INTERVAL:-60}
    command: ["$${OANDA_API_KEY}", "$${OANDA_ACCOUNT_ID}", "$${STRATEGY}", "$${GRANULARITY}", "$${INTERVAL_SEC}"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M


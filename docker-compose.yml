# docker-compose.yml — VPS Live Trading Platform
# Utilisation: docker compose up -d
#
# Services:
#   trader     — LiveStrategyRunner (Java 21, OANDA Practice)
#
# Configuration:
#   - OANDA credentials are loaded from trading-dashboard/.env
#   - Default strategy: VWPReversion + ConsecBar on USD/CHF (highest Sharpe: 4.47)
#   - Change strategy via: STRATEGY=vwp STRATEGY_PAIR=USD_CHF docker compose up -d

services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-live
    restart: unless-stopped
    env_file:
      - ./.env.paper
    environment:
      - OANDA_ENV=practice
      - LOG_LEVEL=INFO
      - TB_ALLOW_ORDERS=1
      - TB_LANE=paper
      # Persistent per-strategy state directory (story 50.1): survives container recreation.
      - TB_STATE_DIR=/app/data/state
      # Strategy selection (override via env):
      # Paper lane (-014): 4 ELITE SQX strategies (Score 93.3 - 95.1, R2 >= 0.96, UPI >= 3.08).
      # Bleeders & non-SQX strategies moved to trading-dev (-012) for rehabilitation.
      - STRATEGY=${STRATEGY:-sq-gbpjpy-h1-breakout-4-5-173 sq-gbpjpy-h1-breakout-3-39-125 sq-gbpjpy-h1-breakout-4-19-179 sq-gbpjpy-h1-breakout-2-20-102}
      - STRATEGY_PAIR=${STRATEGY_PAIR:-GBP_JPY}
      - GRANULARITY=${GRANULARITY:-H1}
      - INTERVAL_SEC=${INTERVAL_SEC:-60}
      # Operations snapshot push to the web hub (absent = push disabled).
      # These two come from the compose-level .env (repo root), NOT from the
      # service env_file: an `environment:` entry wins over `env_file:`, and the
      # empty default below would silently override a token placed there.
      - HERMES_WEB_URL=${HERMES_WEB_URL:-}
      - HERMES_WEB_TOKEN=${HERMES_WEB_TOKEN:-}
    command: ["$${OANDA_API_KEY}", "$${OANDA_ACCOUNT_ID}", "$${STRATEGY}", "$${GRANULARITY}", "$${INTERVAL_SEC}"]
    volumes:
      - ./data:/app/data        # Trade persistence
      - ./logs:/app/logs        # Logs
      - ./config/live-config.json:/app/config/live-config.json:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Dev / Rehab Lane (-012) — Experimental, Hand-Coded & Benched Strategies
  trading-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      - OANDA_ENV=practice
      - LOG_LEVEL=INFO
      - TB_ALLOW_ORDERS=1
      - TB_LANE=dev
      - TB_STATE_DIR=/app/data/state/dev
      - STRATEGY=${DEV_STRATEGY:-vwpreversion consecbar ltrsi3 compmomentum monthweekphase}
      - STRATEGY_PAIR=${DEV_PAIR:-USD_CHF}
      - GRANULARITY=${DEV_GRANULARITY:-H1}
      - INTERVAL_SEC=${DEV_INTERVAL:-60}
      - HERMES_WEB_URL=${HERMES_WEB_URL:-}
      - HERMES_WEB_TOKEN=${HERMES_WEB_TOKEN:-}
    command: ["$${OANDA_API_KEY}", "$${OANDA_ACCOUNT_ID}", "$${STRATEGY}", "$${GRANULARITY}", "$${INTERVAL_SEC}"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config/live-config.json:/app/config/live-config.json:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M


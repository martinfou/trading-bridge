      - STRATEGY=${NEWSOCT12_AJ_STRATEGY:-newsoct12chinacpi}
      - STRATEGY_PAIR=${NEWSOCT12_AJ_PAIR:-AUD_JPY}
      - GRANULARITY=${NEWSOCT12_AJ_GRANULARITY:-H1}
      - INTERVAL_SEC=${NEWSOCT12_AJ_INTERVAL:-60}
    command: ["$${OANDA_API_KEY}", "$${OANDA_ACCOUNT_ID}", "$${STRATEGY}", "$${GRANULARITY}", "$${INTERVAL_SEC}"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Friday fade (Fri 16 Oct 16:00 ET close grid), held over the week-end, flat at the Monday grid
  news-oct12-gc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-news-oct12-gc
    restart: "no"
    env_file:
      - /home/martinfou/projects/trading-dashboard/.env
    environment:
      - OANDA_ENV=practice
      - LOG_LEVEL=INFO
      - TB_ALLOW_ORDERS=1
      - STRATEGY=${NEWSOCT12_GC_STRATEGY:-newsoct12fade}
      - STRATEGY_PAIR=${NEWSOCT12_GC_PAIR:-GBP_CHF}
      - GRANULARITY=${NEWSOCT12_GC_GRANULARITY:-H1}
      - INTERVAL_SEC=${NEWSOCT12_GC_INTERVAL:-60}
    command: ["$${OANDA_API_KEY}", "$${OANDA_ACCOUNT_ID}", "$${STRATEGY}", "$${GRANULARITY}", "$${INTERVAL_SEC}"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  data:
  logs:

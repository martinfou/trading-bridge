# docker/docker-compose.ibkr.yml — IBKR Gateways & Multi-Futures Containers (Paper & Live)
# Usage:
#   Paper stack (default): docker compose -f docker/docker-compose.ibkr.yml --project-name tb-ibkr up -d
#   Live stack (profile):  docker compose -f docker/docker-compose.ibkr.yml --project-name tb-ibkr --profile live up -d ib-gateway-live ibkr-live
#
# Services:
#   ib-gateway-paper — Headless IB Gateway + IBC in Paper mode (127.0.0.1:4002 -> 4004/tcp)
#   ibkr-paper       — Multi-symbol CME Micro Futures (MGC,MNQ,MES) on IB Gateway Paper (:4002, clientId 11/12)
#   ib-gateway-live  — Headless IB Gateway + IBC in Live mode  (127.0.0.1:4001 -> 4003/tcp, profile: live)
#   ibkr-live        — Multi-symbol CME Micro Futures (MGC,MNQ,MES) on IB Gateway Live  (:4001, clientId 21/22, profile: live)

services:
  ib-gateway-paper:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway-paper
    restart: always
    environment:
      TWS_USERID: "${TWS_USERID:-}"
      TWS_PASSWORD: "${TWS_PASSWORD:-}"
      TRADING_MODE: "paper"
      READ_ONLY_API: "${READ_ONLY_API:-no}"
      TWOFA_TIMEOUT_ACTION: "${TWOFA_TIMEOUT_ACTION:-restart}"
      AUTO_RESTART_TIME: "${AUTO_RESTART_TIME:-11:59 PM}"
      TIME_ZONE: "${TIME_ZONE:-America/New_York}"
    ports:
      - "127.0.0.1:4002:4004"
    volumes:
      - ibkr-jts-paper:/home/ibgateway/Jts

  ibkr-paper:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ibkr-paper
    restart: unless-stopped
    depends_on:
      - ib-gateway-paper
    network_mode: "${FUTURES_NETWORK_MODE:-host}"
    entrypoint: ["/app/entrypoint-ibkr.sh"]
    environment:
      - IBKR_ENV=paper
      - IBKR_HOST=${IBKR_HOST:-127.0.0.1}
      - IBKR_PORT=${IBKR_PORT:-4002}
      - IBKR_ACCOUNT_ID=${IBKR_ACCOUNT_ID:-DUR967322}
      - IBKR_CLIENT_ID=${IBKR_CLIENT_ID:-11}
      - FUTURES_SYMBOL=${FUTURES_SYMBOL:-MGC,MNQ,MES}
      - FUTURES_TIMEFRAME=${FUTURES_TIMEFRAME:-1 hour}
      - FUTURES_INTERVAL_MINUTES=${FUTURES_INTERVAL_MINUTES:-60}
      - STRATEGY=${STRATEGY:-MgcM30Breakout49205,MgcH1Breakout38023,MgcH1Breakout51270,MnqH1Breakout31697,MnqH1Breakout69250,MesH1Breakout30808}
      - TB_ALLOW_ORDERS=${TB_ALLOW_ORDERS:-1}
      - TB_LANE=paper
      - TB_STATE_DIR=/app/data/state/ibkr-paper
      # strategies.db vit dans data/runtime/generator ; sans cette variable, RuntimeDataPaths
      # retombe sur ~/.trading-bridge dans l'image (pas de pom.xml) et le catalogue reste vide :
      # « Unknown strategy 'MgcH1Breakout38023' ».
      - TRADING_BRIDGE_DATA_DIR=/app/data/runtime
      - DRY_RUN=${DRY_RUN:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data:/app/data
      - ../scripts/docker-entrypoint-ibkr.sh:/app/entrypoint-ibkr.sh:ro
      - ../config/live-config.json:/app/config/live-config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "n=\"IbkrLive\"; n=\"$${n}Runner\"; for p in /proc/[0-9]*; do tr '\\0' ' ' < \"$$p/cmdline\" 2>/dev/null | grep -q \"$$n\" && exit 0; done; exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  ib-gateway-live:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway-live
    profiles: ["live"]
    restart: always
    environment:
      TWS_USERID: "${TWS_LIVE_USERID:-${TWS_USERID:-}}"
      TWS_PASSWORD: "${TWS_LIVE_PASSWORD:-${TWS_PASSWORD:-}}"
      TRADING_MODE: "live"
      READ_ONLY_API: "${READ_ONLY_API:-no}"
      TWOFA_TIMEOUT_ACTION: "${TWOFA_TIMEOUT_ACTION:-restart}"
      AUTO_RESTART_TIME: "${AUTO_RESTART_TIME:-11:59 PM}"
      TIME_ZONE: "${TIME_ZONE:-America/New_York}"
    ports:
      - "127.0.0.1:4001:4003"
    volumes:
      - ibkr-jts-live:/home/ibgateway/Jts

  ibkr-live:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ibkr-live
    profiles: ["live"]
    restart: unless-stopped
    depends_on:
      - ib-gateway-live
    network_mode: "${FUTURES_NETWORK_MODE:-host}"
    entrypoint: ["/app/entrypoint-ibkr.sh"]
    environment:
      - IBKR_ENV=live
      - IBKR_HOST=${IBKR_HOST:-127.0.0.1}
      - IBKR_PORT=${IBKR_LIVE_PORT:-4001}
      - IBKR_ACCOUNT_ID=${IBKR_LIVE_ACCOUNT_ID:-}
      - IBKR_CLIENT_ID=${IBKR_LIVE_CLIENT_ID:-21}
      - FUTURES_SYMBOL=${FUTURES_SYMBOL:-MGC,MNQ,MES}
      - FUTURES_TIMEFRAME=${FUTURES_TIMEFRAME:-1 hour}
      - FUTURES_INTERVAL_MINUTES=${FUTURES_INTERVAL_MINUTES:-60}
      - STRATEGY=${LIVE_STRATEGY:-MgcH1Breakout38023,MnqH1Breakout31697,MesH1Breakout30808}
      - TB_ALLOW_ORDERS=${TB_ALLOW_ORDERS:-1}
      - TB_LANE=prod
      - TB_STATE_DIR=/app/data/state/ibkr-live
      - TRADING_BRIDGE_DATA_DIR=/app/data/runtime
      - DRY_RUN=${DRY_RUN:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data:/app/data
      - ../scripts/docker-entrypoint-ibkr.sh:/app/entrypoint-ibkr.sh:ro
      - ../config/live-config.json:/app/config/live-config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "n=\"IbkrLive\"; n=\"$${n}Runner\"; for p in /proc/[0-9]*; do tr '\\0' ' ' < \"$$p/cmdline\" 2>/dev/null | grep -q \"$$n\" && exit 0; done; exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  ibkr-jts-paper:
  ibkr-jts-live:

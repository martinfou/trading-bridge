# docker/docker-compose.futures.yml — IBKR Futures Paper Lane (Story 46.11)
# Usage:
#   docker compose -f docker/docker-compose.futures.yml --project-name tb-futures up -d
#
# Isolated from the main docker-compose.yml (OANDA lane) and its ./data directory.

services:
  trading-futures:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: trading-futures
    restart: unless-stopped
    network_mode: "${FUTURES_NETWORK_MODE:-host}"
    entrypoint: ["/app/entrypoint-ibkr.sh"]
    environment:
      - IBKR_HOST=${IBKR_HOST:-127.0.0.1}
      - IBKR_PORT=${IBKR_PORT:-4002}
      - IBKR_ACCOUNT_ID=${IBKR_ACCOUNT_ID:-DUR967322}
      - IBKR_CLIENT_ID=${IBKR_CLIENT_ID:-11}
      - FUTURES_SYMBOL=${FUTURES_SYMBOL:-MGC}
      - FUTURES_TIMEFRAME=${FUTURES_TIMEFRAME:-30 mins}
      - FUTURES_INTERVAL_MINUTES=${FUTURES_INTERVAL_MINUTES:-30}
      - STRATEGY=${STRATEGY:-sq-mgc-m30-breakout-0-24542}
      - TB_ALLOW_ORDERS=${TB_ALLOW_ORDERS:-1}
      - TB_STATE_DIR=/app/data-futures/state
      - DRY_RUN=${DRY_RUN:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data-futures:/app/data-futures
      - ../scripts/docker-entrypoint-ibkr.sh:/app/entrypoint-ibkr.sh:ro
      - ../config/live-config.json:/app/config/live-config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "n=\"IbkrLive\"; n=\"$${n}Runner\"; for p in /proc/[0-9]*; do tr '\\0' ' ' < \"$$p/cmdline\" 2>/dev/null | grep -q \"$$n\" && exit 0; done; exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
